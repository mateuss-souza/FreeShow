name: Edge blend installers

# Builds this fork for Windows (unsigned installer) and macOS (ad-hoc signed, Intel build that also runs on Apple Silicon, for testing at home)
# and publishes both on one GitHub pre-release. Installed Windows copies check these releases and offer the update
# (installed when FreeShow is closed). The Mac build has no in-app updates: macOS requires an Apple-signed app.
on:
    push:
        branches:
            - "feature/edge-blend-group"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: edge-blend-windows
    cancel-in-progress: false

jobs:
    # one release created up front at this commit: the builds below upload into it (electron-builder uploads
    # files in parallel and would otherwise race and create duplicate releases for the same tag)
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            # x.y.z from upstream's version, then -blend.<build number>, so every build is newer than the last
            - name: Set fork version
              shell: bash
              run: |
                  base=$(node -p "require('./package.json').version.split('-')[0]")
                  version="$base-blend.${{ github.run_number }}"
                  npm version "$version" --no-git-tag-version --allow-same-version
                  echo "Building $version"
                  echo "FORK_VERSION=$version" >> "$GITHUB_ENV"

            - name: Create release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release create "v$FORK_VERSION" --prerelease --target "$GITHUB_SHA" --title "$FORK_VERSION" --notes "Edge blend build $FORK_VERSION. Windows installer is the x64 exe, Mac test build is the x64 dmg (runs on Apple Silicon through Rosetta)."

    windows:
        needs: release
        runs-on: windows-2022
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            # x.y.z from upstream's version, then -blend.<build number>, so every build is newer than the last
            - name: Set fork version
              shell: bash
              run: |
                  base=$(node -p "require('./package.json').version.split('-')[0]")
                  version="$base-blend.${{ github.run_number }}"
                  npm version "$version" --no-git-tag-version --allow-same-version
                  echo "Building $version"
                  echo "FORK_VERSION=$version" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: npm ci

            - name: Build app
              run: npm run build

            - name: Build installer and publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx electron-builder --config config/building/electron-builder.local.yaml --publish always

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: FreeShow-edge-blend-windows
                  path: dist/*.exe
                  retention-days: 30

    mac:
        needs: release
        # Intel runner: GitHub's Apple Silicon runners are often unavailable (capacity); the x64 app runs on Apple Silicon through Rosetta
        runs-on: macos-15-intel
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            # native modules: https://github.com/nodejs/node-gyp/issues/2869
            - name: Install Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            # x.y.z from upstream's version, then -blend.<build number>, so every build is newer than the last
            - name: Set fork version
              shell: bash
              run: |
                  base=$(node -p "require('./package.json').version.split('-')[0]")
                  version="$base-blend.${{ github.run_number }}"
                  npm version "$version" --no-git-tag-version --allow-same-version
                  echo "Building $version"
                  echo "FORK_VERSION=$version" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: |
                  npm ci
                  npm i --no-save dmg-license

            - name: Build app
              run: npm run build

            # ad-hoc signed (required to run on Apple Silicon), not notarized: open it the first time with right-click > Open
            - name: Build disk image
              run: npx electron-builder --mac dmg --x64 --config config/building/electron-builder.mac-dev.yaml --publish never

            - name: Add disk image to the release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "v$FORK_VERSION" dist/*.dmg --clobber
