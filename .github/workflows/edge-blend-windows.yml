name: Edge blend Windows installer

# Builds an unsigned Windows installer of this fork and publishes it as a GitHub pre-release.
# Installed copies check these releases and offer the update (installed when FreeShow is closed).
on:
    push:
        branches:
            - "feature/edge-blend-group"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: edge-blend-windows
    cancel-in-progress: false

jobs:
    windows:
        runs-on: windows-2022
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js and NPM
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            # x.y.z from upstream's version, then -blend.<build number>, so every build is newer than the last
            - name: Set fork version
              shell: bash
              run: |
                  base=$(node -p "require('./package.json').version.split('-')[0]")
                  version="$base-blend.${{ github.run_number }}"
                  npm version "$version" --no-git-tag-version --allow-same-version
                  echo "Building $version"
                  echo "FORK_VERSION=$version" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: npm ci

            - name: Build app
              run: npm run build

            # one release created up front at this commit: electron-builder uploads files in parallel and
            # would otherwise race and create duplicate releases for the same tag
            - name: Create release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release create "v$FORK_VERSION" --prerelease --target "$GITHUB_SHA" --title "$FORK_VERSION" --notes "Edge blend build $FORK_VERSION"

            - name: Build installer and publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx electron-builder --config config/building/electron-builder.local.yaml --publish always

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: FreeShow-edge-blend-windows
                  path: dist/*.exe
                  retention-days: 30
