extends: config/building/electron-builder.yaml

win:
    azureSignOptions: null

mac:
    identity: null

# this fork updates from its own GitHub releases (embedded in the app as app-update.yml)
publish:
    provider: github
    owner: mateuss-souza
    repo: FreeShow
    releaseType: prerelease
    channel: blend

# the in-app update reinstalls silently: put the shortcuts back every time, so the app is always easy to find
nsis:
    createDesktopShortcut: always
    createStartMenuShortcut: true
    shortcutName: FreeShow
